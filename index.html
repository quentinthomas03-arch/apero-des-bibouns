<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Apéro des Bibouns</title>
<meta name="theme-color" content="#ff206e" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="debug-error" style="display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#c0392b;color:#fff;padding:14px;font-family:monospace;font-size:12px;white-space:pre-wrap;max-height:50vh;overflow:auto;"></div>
<script>
  function showDebugError(msg) {
    var el = document.getElementById('debug-error');
    if (!el) return;
    el.style.display = 'block';
    el.textContent = (el.textContent ? el.textContent + '\n---\n' : '') + msg;
  }
  window.addEventListener('error', function (e) {
    showDebugError('ERREUR JS : ' + e.message + '\nFichier : ' + e.filename + '\nLigne : ' + e.lineno + ':' + e.colno);
  });
  window.addEventListener('unhandledrejection', function (e) {
    showDebugError('PROMESSE REJETÉE : ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
</script>

<div id="turn-banner" class="turn-banner"></div>

<!-- ===== SETUP SCREEN ===== -->
<section id="screen-setup" class="screen active">
  <div class="card">
    <h1>🍹 Apéro des Bibouns 🎉</h1>
    <p class="subtitle">Le quiz culture G, sans pub ni traçage.</p>

    <h2>Joueurs</h2>
    <div class="add-player-row">
      <input id="player-name-input" type="text" placeholder="Prénom du joueur" maxlength="20" />
      <button id="add-player-btn" class="btn btn-secondary">Ajouter</button>
    </div>
    <ul id="player-list" class="player-list"></ul>

    <h2>Nombre de questions</h2>
    <div class="count-row">
      <button class="count-btn selected" data-count="10">10</button>
      <button class="count-btn" data-count="20">20</button>
      <button class="count-btn" data-count="30">30</button>
      <button class="count-btn" data-count="50">50</button>
    </div>

    <button id="start-game-btn" class="btn btn-primary btn-large" disabled>🚀 Lancer la partie</button>
  </div>
</section>

<!-- ===== GAME SCREEN ===== -->
<section id="screen-game" class="screen">
  <div class="card">
    <div class="overall-progress-track">
      <div id="overall-progress-fill" class="overall-progress-fill"></div>
    </div>
    <div class="game-header">
      <span id="progress" class="progress"></span>
      <span id="category-badge" class="badge"></span>
    </div>
    <span id="bonus-badge" class="bonus-badge hidden">⭐ QUESTION BONUS x2 !</span>
    <h2 id="turn-player" class="turn-player"></h2>
    <div id="round-dots" class="round-dots"></div>

    <div class="question-box">
      <p id="question-text" class="question-text"></p>
    </div>

    <div id="answer-box" class="answer-box hidden">
      <span class="answer-label">Réponse</span>
      <p id="answer-text" class="answer-text"></p>
    </div>

    <button id="reveal-btn" class="btn btn-primary btn-large">👁️ Révéler la réponse</button>
    <button id="steal-trigger-btn" class="btn btn-steal-trigger">🎯 Un autre joueur tente sa chance</button>

    <div id="judge-buttons" class="judge-buttons hidden">
      <button id="wrong-btn" class="btn btn-wrong">❌ Mauvaise réponse</button>
      <button id="correct-btn" class="btn btn-correct">✅ Bonne réponse</button>
    </div>

    <div id="steal-panel" class="steal-panel hidden">
      <p class="steal-title">🎯 Qui tente sa chance à la place ?</p>
      <div id="steal-buttons" class="steal-buttons"></div>
      <button id="steal-none-btn" class="btn btn-secondary">Annuler</button>
    </div>

    <div id="mini-scores" class="mini-scores"></div>
  </div>
</section>

<!-- ===== END SCREEN ===== -->
<section id="screen-end" class="screen">
  <canvas id="confetti-canvas"></canvas>
  <div class="card">
    <h1>🏆 Résultats</h1>
    <ul id="final-scores" class="final-scores"></ul>
    <button id="replay-btn" class="btn btn-primary btn-large">🔁 Rejouer (mêmes joueurs)</button>
    <button id="new-game-btn" class="btn btn-secondary">👥 Changer les joueurs</button>
  </div>
</section>

<script type="module" src="app.js"></script>
</body>
</html>
